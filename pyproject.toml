[project]
name = "synapse-qr-print"
version = "0.1.0"
description = "synapse module: prints messages as QR codes"
requires-python = ">=3.10"
dependencies = ["qrcode[pil]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools] 
packages = ["synapse_qr_print"]